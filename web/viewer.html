<!doctype html>
<html><head><meta charset="utf-8"><title>USB Viewer</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:-apple-system,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  #stage img{max-width:100%;max-height:100%;object-fit:contain}
  #stage video{width:100%;height:100%;object-fit:contain;background:#000}
  #stage iframe{width:100%;height:100%;border:0;background:#fff}
  #bar{background:#161616;border-top:1px solid #333;padding:10px 18px 12px;display:flex;align-items:flex-end;gap:20px}
  #where{flex:1;min-width:0}
  #folder{font-size:17px;color:#9ab;word-break:break-word}
  #name{font-size:24px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #count{font-size:16px;color:#aaa;white-space:nowrap;text-align:right}
  #prog{height:5px;background:#333}
  #prog div{height:100%;background:#3a8;width:0;transition:width .3s}
  .msg{text-align:center;font-size:22px;color:#aaa}
  #unmute{position:absolute;top:16px;right:16px;font-size:18px;padding:10px 16px;border:0;border-radius:10px;
          background:#fffd;cursor:pointer;display:none}
</style></head><body>
<div id="stage"></div>
<div id="bar">
  <div id="where"><div id="folder"></div><div id="name"></div></div>
  <div id="count"></div>
</div>
<div id="prog"><div></div></div>
<script>
let version = -1, cmd = null, shownReady = null;
const stage = document.getElementById('stage');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mb = n => (n / 1048576).toFixed(1) + ' MB';
const pct = s => Math.floor(100 * s.seen / s.total);

function startMedia() {
  const m = stage.querySelector('video,audio');
  if (!m) return;
  m.play().catch(() => {           // autoplay with sound blocked: play muted, offer unmute
    m.muted = true;
    m.play();
    const b = document.createElement('button');
    b.id = 'unmute'; b.textContent = '🔇 Click to unmute'; b.style.display = 'block';
    b.onclick = () => { m.muted = false; b.remove(); };
    stage.appendChild(b);
  });
}

function render(s) {
  const src = '/file/' + s.index + '?v=' + s.version;
  if (s.error) stage.innerHTML = `<div class="msg">Could not convert video<br><small>${esc(s.error)}</small></div>`;
  else if (!s.ready) stage.innerHTML = `<div class="msg">Converting video for playback…</div>`;
  else if (s.kind.startsWith('image')) stage.innerHTML = `<img src="${src}">`;
  else if (s.kind.startsWith('video')) stage.innerHTML = `<video src="${src}" controls></video>`;
  else if (s.kind === 'audio') stage.innerHTML = `<div class="msg"><img src="/thumb/${s.index}" style="max-height:40vh"><br>♪<br><audio src="${src}" controls></audio></div>`;
  else if (['pdf','text','doc'].includes(s.kind)) stage.innerHTML = `<iframe src="${src}"></iframe>`;
  else stage.innerHTML = `<div class="msg"><img src="/thumb/${s.index}"><br><small>No preview for this file type · ${mb(s.size)}</small></div>`;
  startMedia();
}

function renderBar(s) {
  document.getElementById('folder').textContent = (s.folder ? '📁 ' + s.folder.replaceAll('/', '  ›  ') : '📁 (top level)');
  document.getElementById('name').textContent = s.name;
  document.getElementById('count').innerHTML = `${(s.index + 1).toLocaleString()} / ${s.total.toLocaleString()}<br>${s.seen.toLocaleString()} seen · ${pct(s)}%`;
  document.querySelector('#prog div').style.width = (100 * s.seen / s.total) + '%';
}

async function poll() {
  try {
    const s = await (await fetch('/api/state')).json();
    if (s.version !== version || s.ready !== shownReady) {
      if (s.version !== version) renderBar(s);
      version = s.version; shownReady = s.ready; render(s);
    }
    if (cmd !== null && s.cmd !== cmd) {
      const m = stage.querySelector('video,audio');
      if (m) m.paused ? m.play() : m.pause();
    }
    cmd = s.cmd;
  } catch (e) {}
  setTimeout(poll, 400);
}
const go = d => fetch('/api/go?delta=' + d, {method: 'POST'});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
poll();
</script></body></html>
